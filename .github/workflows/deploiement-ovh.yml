# Publie le site sur l'hébergement OVH à chaque fusion dans main.
#
# Le site est un fichier unique : on l'envoie tel quel par FTPS, sans
# étape de compilation. Volontairement, on n'utilise pas d'action de
# synchronisation tierce — un simple envoi ne peut jamais supprimer
# un fichier existant sur le serveur par effet de bord.
#
# Trois secrets à définir dans GitHub (Settings → Secrets and
# variables → Actions) :
#   FTP_HOST     ftp.cluster021.hosting.ovh.net
#   FTP_USER     l'identifiant FTP vu dans l'espace OVH
#   FTP_PASSWORD le mot de passe FTP

name: Déploiement OVH

on:
  # Fusion dans main : mise en production.
  push:
    branches: [main]
  # Permet aussi de relancer un déploiement à la main depuis l'onglet
  # Actions, sans avoir à faire un commit.
  workflow_dispatch:

# Deux déploiements simultanés écriraient le même fichier : on laisse
# le plus récent terminer et on annule celui d'avant.
concurrency:
  group: deploiement-ovh
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp netcat-openbsd

      # Étape de diagnostic : dit où ça coince sans jamais afficher
      # d'identifiant. Les secrets sont masqués par GitHub, mais on
      # évite quand même de les faire transiter dans les traces.
      - name: Diagnostic de la connexion
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          echo "--- 1. Le nom d'hôte se résout-il ? ---"
          getent hosts "$FTP_HOST" || echo "ÉCHEC : nom d'hôte introuvable (FTP_HOST est-il correct ?)"

          echo "--- 2. Le port 21 est-il joignable depuis GitHub ? ---"
          nc -z -w 10 "$FTP_HOST" 21 && echo "port 21 ouvert" || echo "ÉCHEC : port 21 injoignable"

          echo "--- 3. Bannière du serveur et support de TLS ---"
          curl -sv --max-time 20 --user "anonymous:diagnostic" "ftp://$FTP_HOST/" 2>&1 \
            | grep -iE "^\* Connected|220|AUTH|530|denied|refused" | head -8 || true

      - name: Envoyer index.html sur OVH
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Envoi de index.html ($(wc -c < index.html) octets)"
          # curl échouait en « server response timeout » : sa
          # négociation FTPS ne s'entend pas avec le serveur d'OVH.
          # lftp gère ces particularités (mode passif, réutilisation
          # de la session TLS sur le canal de données).
          #
          # « put » vise un seul fichier : contrairement à une
          # synchronisation, il ne peut rien supprimer sur le serveur.
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            set ftp:passive-mode true;
            set net:timeout 20;
            set net:max-retries 3;
            set cmd:fail-exit true;
            open -u '$FTP_USER','$FTP_PASSWORD' '$FTP_HOST';
            put -O /www index.html;
          "

      - name: Vérifier que le site sert bien la nouvelle version
        run: |
          set -euo pipefail
          # Le cache serveur peut mettre quelques secondes à suivre.
          sleep 10
          attendu=$(wc -c < index.html)
          servi=$(curl --silent --location --max-time 30 https://lawave.fr | wc -c)
          echo "attendu : $attendu octets — servi : $servi octets"
          if [ "$attendu" -ne "$servi" ]; then
            echo "::error::Le site ne sert pas la version déployée."
            exit 1
          fi
          echo "Déploiement confirmé."
